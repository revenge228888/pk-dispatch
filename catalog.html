<style>
/* [CATALOG] Approved reference: warm sand, dark brand bar, Prompt/Anuphan spec book. */
:root{--bg:#f8f1e2;--surface:#fffcf5;--ink:#1e1d1a;--muted:#6e675a;--line:#e4d9c2;--bar:#1e1d1a;--bar-ink:#f5efe2;--accent:#9a6b35;--accent-ink:#7a5226;--chip:#efe5d0;--edit:#2563c9;--edit-bg:#e8f0fd;--display:"Prompt",system-ui,sans-serif;--body:"Anuphan",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--surface:#201f1b;--ink:#efe9dc;--muted:#a69e8e;--line:#34312a;--bar:#0d0c0a;--bar-ink:#efe9dc;--accent:#cf9a5c;--accent-ink:#e2b37b;--chip:#2b2923;--edit:#7aa7f0;--edit-bg:#1c2738;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--body)}h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.25;margin:0;text-wrap:balance}a{color:inherit}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}img{display:block;max-width:100%}a,button,input,[contenteditable]{overflow-wrap:anywhere}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}[hidden]{display:none!important}
.cat-wrap{max-width:820px;margin:auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}.cat-bar{background:var(--bar);color:var(--bar-ink)}.cat-bar .cat-wrap{display:flex;align-items:center;gap:10px;padding-block:10px}.cat-bar img{width:30px}.cat-bar a{font-family:var(--display);text-decoration:none}.cat-bar a:last-child{margin-left:auto}.cat-embed .cat-bar{display:none}.cat-toolbar{position:sticky;top:0;z-index:8;background:var(--surface);border-bottom:1px solid var(--line);padding-block:8px}.cat-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cat-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:8px 16px;background:var(--surface);text-decoration:none;font-weight:600;font-size:15px}.cat-pri{background:var(--accent);color:#fff;border-color:var(--accent)}.cat-small{font-size:13px;padding:4px 10px}.cat-draft{border:1px solid var(--edit);border-radius:6px;color:var(--edit);font-size:13px;padding:2px 8px}.cat-eyebrow{font:13px var(--display);letter-spacing:.14em;color:var(--accent-ink);margin:0 0 4px}.cat-hero{padding-block:28px 18px;display:grid;gap:14px}.cat-hero h1{font-size:clamp(30px,8vw,48px)}.cat-lead{color:var(--muted);margin:0}.cat-products{display:grid;gap:12px;padding-bottom:30px}.cat-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}.cat-card>a{display:grid;grid-template-columns:120px minmax(0,1fr);align-items:center;gap:14px;text-decoration:none}.cat-card img{width:120px;height:90px;object-fit:cover;border-radius:8px}.cat-card h3{font-size:19px}.cat-card small{color:var(--muted);display:block}.cat-card .cat-row{margin-top:10px}.cat-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cat-fact{border-left:2px solid var(--accent);padding-left:10px}.cat-fact small{display:block;color:var(--muted);font-size:13px}.cat-fact b{font:500 19px var(--display)}.cat-cover{width:100%;max-height:260px;object-fit:cover;border-radius:12px}.cat-toc{position:sticky;top:var(--cat-toolbar-height,54px);z-index:5;background:var(--bg);border-block:1px solid var(--line)}.cat-toc .cat-wrap{display:flex;gap:4px;overflow-x:auto;padding-block:7px}.cat-toc button{flex:none;border:0;border-radius:99px;padding:4px 12px;background:none;color:var(--muted);font-size:14px}.cat-toc button[aria-current="true"]{background:var(--ink);color:var(--bg)}.cat-sec{padding-block:26px;border-top:1px solid var(--line);scroll-margin-top:calc(var(--cat-toolbar-height,54px) + 64px)}.cat-sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}.cat-sec h2{font-size:24px}.cat-en{font:13px var(--display);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.cat-tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.cat-hidden{opacity:.5}.cat-screen{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:10px}.cat-screen video,.cat-screen img{width:100%;height:100%;object-fit:contain}.cat-screen a{display:block;height:100%;position:relative}.cat-screen span{position:absolute;bottom:12px;left:12px;background:#111;color:white;padding:4px 12px;border-radius:8px}.cat-seg{display:flex;flex-wrap:wrap;gap:6px}.cat-seg button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:7px 12px;text-align:left;font-size:14px}.cat-seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}.cat-seg small{display:block}.cat-specs{display:grid;gap:12px}.cat-spec,.cat-note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.cat-spec h3{font-size:17px;margin-bottom:8px}.cat-spec dl{margin:0}.cat-spec dl>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;border-bottom:1px solid var(--line);padding:6px 0}.cat-spec dt{color:var(--muted)}.cat-spec dd{margin:0}.cat-swatches{display:flex;gap:14px;flex-wrap:wrap}.cat-swatches figure{margin:0;width:90px;text-align:center;font-size:13px;display:grid;justify-items:center;gap:5px}.cat-swatches img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}.cat-gallery{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.cat-gallery figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}.cat-gallery img{width:100%;aspect-ratio:4/3;object-fit:cover}.cat-gallery figcaption{padding:10px 12px}.cat-gallery h3{font-size:16px}.cat-gallery small{color:var(--muted)}.cat-gallery-wide{grid-template-columns:1fr}.cat-dots{display:flex;gap:5px;justify-content:center;margin:8px}.cat-dots button{width:14px;height:14px;border-radius:50%;border:1px solid var(--accent);background:var(--chip);padding:0}.cat-dots button[aria-pressed="true"]{background:var(--accent)}.cat-wait{display:grid;place-items:center;min-height:80px;border:1px dashed var(--line);color:var(--muted)}.cat-editing [data-path]{outline:1px dashed var(--edit);outline-offset:2px;min-width:20px;min-height:1.3em;white-space:pre-wrap}.cat-editing [data-path]:focus{background:var(--edit-bg)}.cat-editing [data-cat-image]{cursor:pointer;outline:2px dashed var(--edit)}.cat-field{display:grid;gap:4px;margin:10px 0}.cat-field input,.cat-field select{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px}.cat-new{padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:20px}.cat-contact{margin-top:24px;background:var(--bar);color:var(--bar-ink);padding-block:24px;scroll-margin-top:100px}.cat-contact h2{font-size:21px}.cat-contact p{margin:8px 0}.cat-contact .cat-row{gap:8px 18px}.cat-error{color:var(--edit);white-space:pre-wrap;padding:8px 0}.cat-dialog{max-width:min(92vw,480px);border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}.cat-dialog::backdrop{background:#0008}.cat-dialog p{white-space:pre-wrap}.cat-busy{cursor:wait}.cat-busy #catMain,.cat-busy #catToolbar{opacity:.6}.cat-status{min-height:1.5em;font-size:14px;overflow-wrap:anywhere}
@media(min-width:600px){.cat-facts{grid-template-columns:repeat(4,minmax(0,1fr))}.cat-specs{grid-template-columns:1fr 1fr}.cat-gallery{grid-template-columns:repeat(4,minmax(0,1fr))}.cat-gallery-wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:360px){.cat-card>a{grid-template-columns:90px minmax(0,1fr)}.cat-card img{width:90px}.cat-btn{padding:7px 11px}}
</style></head><body>
<header class="cat-bar"><div class="cat-wrap"><img src="catalog-media/logo.png" alt="โลโก้ PK"><a href="#home">มุ้งจีบพีเค</a><a href="#catContact" data-cat-op="contact">ติดต่อเรา</a></div></header>
<div class="cat-toolbar" id="catToolbar"></div>
<div class="cat-wrap cat-status" id="catStatus" role="status" aria-live="polite"></div>
<main id="catMain"><div class="cat-wrap cat-hero">กำลังโหลดแคตตาล็อก…</div></main>
<section class="cat-contact" id="catContact"><div class="cat-wrap"><h2>ส่งรูปช่องให้ประเมินราคา</h2><p>LINE @PK2541</p><div class="cat-row"><a href="https://line.me/R/ti/p/%40PK2541" target="_blank" rel="noopener">เปิด LINE</a><a href="tel:0990912389">099-091-2389</a><a href="tel:0620891989">062-089-1989</a></div></div></section>
<input type="file" id="catPicker" accept="image/jpeg,image/png,image/webp" hidden>
<dialog id="catDialog" class="cat-dialog"><form method="dialog"><p id="catDialogText"></p><div class="cat-row"><button class="cat-btn" value="cancel">ยกเลิก</button><button class="cat-btn cat-pri" value="ok">ยืนยัน</button></div></form></dialog>
<script>
// [CATALOG] Same-origin iframe session; Worker-first reads, GAS writes without retry/timeout.
const PK_CAT_API='https://pk-discord-relay.revenge2288.workers.dev/api';
const PK_CAT_URL='https://revenge228888.github.io/pk-dispatch/catalog.html';
const catState={user:null,manager:false,items:[],edit:false,current:null,dirty:false,busy:false,route:'#home',observer:null,video:{},gallery:{}};
function catEsc_(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function catUrl_(v){const s=typeof v==='string'?v:'';return /^catalog-media\/[a-zA-Z0-9_-]+\.(?:jpg|jpeg|png|webp|mp4)$/i.test(s)||/^https:\/\/(?:lh3\.googleusercontent\.com|www\.youtube\.com|youtu\.be)\/[^\s\\<>]*$/.test(s)?s:'';}
function catUser_(){try{return JSON.parse(localStorage.getItem('pk_user')||'null');}catch(e){return null;}}
function catStatus_(s){document.getElementById('catStatus').textContent=s||'';}
function catCopy_(x){return JSON.parse(JSON.stringify(x));}
// Products a manager can import once; each needs catalog-media/seed-<id>.json.
const CAT_SEEDS=[{id:'mungjeeb',name:'มุ้งจีบ'},{id:'mungluean',name:'มุ้งบานเลื่อน'}];
function catButton_(op,label,attrs){return '<button type="button" class="cat-btn cat-small" data-cat-op="'+op+'" '+(attrs||'')+'>'+catEsc_(label)+'</button>';}
function catText_(path,text,tag,cls){tag=tag||'span';return '<'+tag+' class="'+(cls||'')+'"'+(catState.edit?' data-path="'+catEsc_(path)+'" contenteditable="true" role="textbox" aria-label="'+catEsc_(path)+'"':'')+'>'+catEsc_(text).replace(/\n/g,'<br>')+'</'+tag+'>';}
function catImage_(path,url,alt){const src=catUrl_(url);return '<div'+(catState.edit?' data-cat-image="'+catEsc_(path)+'" tabindex="0" role="button" aria-label="เปลี่ยนรูป"':'')+'>'+(src?'<img src="'+catEsc_(src)+'" alt="'+catEsc_(alt||'')+'" loading="lazy" referrerpolicy="no-referrer">':'<div class="cat-wait">'+(catState.edit?'กดเพื่อเลือกรูป':'ยังไม่มีรูป')+'</div>')+'</div>'+(catState.edit?catButton_('clear-image','ลบรูป','data-cat-path="'+catEsc_(path)+'"'):'');}
function catGet_(path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],catState.current.data);}
function catSet_(path,value){const keys=path.split('.');if(keys.some(k=>['__proto__','prototype','constructor'].includes(k)))return;let o=catState.current.data;for(const k of keys.slice(0,-1))o=o[k];o[keys[keys.length-1]]=value;catDirty_();}
function catDraftKey_(){return 'pk_cat_draft_'+catState.current.id;}
function catDirty_(){catState.dirty=true;try{localStorage.setItem(catDraftKey_(),JSON.stringify({owner:catState.user.username,item:catState.current}));catStatus_('มีการแก้ไขที่ยังไม่บันทึก · เก็บร่างในเครื่องแล้ว');}catch(e){catStatus_('ยังไม่บันทึก · เก็บร่างในเครื่องไม่ได้ กรุณาบันทึกก่อนปิดหน้า');}}
function catStored_(){if(!catState.current||!catState.manager)return null;try{const d=JSON.parse(localStorage.getItem(catDraftKey_())||'null');return d&&d.owner===catState.user.username&&d.item&&d.item.id===catState.current.id?d.item:null;}catch(e){return null;}}
async function catCall_(action,extra){const u=catUser_();if(!u)throw new Error('กรุณาเข้าสู่ระบบ PK Dispatch ใหม่');const r=await fetch(PK_CAT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},extra||{},{username:u.username,token:u.token,action:action}))});const d=await r.json();if(!d.ok)throw new Error(d.error||'บันทึกไม่สำเร็จ');return d;}
async function catFast_(){
  const u=catState.user,auth=u&&['manager','office','sales'].includes(u.role),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);
  try{const r=await fetch(PK_CAT_API.replace(/\/api$/,auth?'/cat-list':'/cat-public'),{method:'POST',headers:{'Content-Type':'application/json'},signal:controller.signal,body:JSON.stringify(auth?{username:u.username,token:u.token}:{})});const d=await r.json();if(r.ok&&d.ok&&Array.isArray(d.items))return d;throw new Error(d.error||'โหลดข้อมูลไม่สำเร็จ');}
  catch(e){if(auth)return await catCall_('pk_catList');throw e;}finally{clearTimeout(timer);}
}
async function catRun_(fn){if(catState.busy)return;catState.busy=true;document.body.classList.add('cat-busy');document.getElementById('catMain').inert=true;document.getElementById('catToolbar').inert=true;try{await fn();}catch(e){catStatus_(e.message||'ทำรายการไม่สำเร็จ กรุณาลองใหม่');}finally{catState.busy=false;document.body.classList.remove('cat-busy');document.getElementById('catMain').inert=false;document.getElementById('catToolbar').inert=false;}}
function catAsk_(text){return new Promise(resolve=>{const d=document.getElementById('catDialog');document.getElementById('catDialogText').textContent=text;d.returnValue='cancel';d.addEventListener('close',()=>resolve(d.returnValue==='ok'),{once:true});d.showModal();});}
function catToolbar_(){let s=catButton_('home','← แคตตาล็อก')+catButton_('copy','คัดลอกลิงก์')+catButton_('share','แชร์');if(catState.manager){s+=catButton_('edit',catState.edit?'ออกจากโหมดแก้ไข':'แก้ไข');if(catState.current){if(catState.edit)s+='<label>สถานะ <select id="catStatusSelect"><option value="draft"'+(catState.current.status==='draft'?' selected':'')+'>ร่าง</option><option value="published"'+(catState.current.status==='published'?' selected':'')+'>เผยแพร่</option></select></label>'+catButton_('save','บันทึก')+catButton_('cancel','ยกเลิก');if(catStored_())s+=catButton_('recover','กู้ร่างในเครื่อง');}}s+=catButton_('reload','โหลดใหม่');document.getElementById('catToolbar').innerHTML='<div class="cat-wrap cat-row">'+s+'</div>';catMeasure_();}
function catMeasure_(){document.documentElement.style.setProperty('--cat-toolbar-height',document.getElementById('catToolbar').offsetHeight+'px');}
function catHome_(){
  const items=catState.items.filter(x=>x.status==='published'||catState.manager).sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id));
  let s='<div class="cat-wrap cat-hero"><p class="cat-eyebrow">PK PRODUCT CATALOG</p><h1>แคตตาล็อกสินค้า</h1></div><div class="cat-wrap cat-products">';
  if(!items.length)s+='<p>ยังไม่มีสินค้าที่เผยแพร่</p>';
  s+=items.map(x=>'<article class="cat-card"><a href="#p-'+catEsc_(x.id)+'">'+(catUrl_(x.data.cover)?'<img src="'+catEsc_(catUrl_(x.data.cover))+'" alt="" referrerpolicy="no-referrer">':'<div class="cat-wait">ยังไม่มีรูป</div>')+'<div><p class="cat-eyebrow">'+catEsc_(x.data.en)+'</p><h3>'+catEsc_(x.name)+'</h3><small>'+catEsc_(x.data.summary)+'</small>'+(x.status==='draft'?'<span class="cat-draft">ร่าง</span>':'')+'</div></a>'+(catState.edit?'<div class="cat-row">'+catButton_('order','↑','data-cat-id="'+catEsc_(x.id)+'" data-cat-delta="-1"')+catButton_('order','↓','data-cat-id="'+catEsc_(x.id)+'" data-cat-delta="1"')+catButton_('delete','ลบสินค้า','data-cat-id="'+catEsc_(x.id)+'"')+'</div>':'')+'</article>').join('');
  if(catState.manager){CAT_SEEDS.forEach(x=>{if(!catState.items.some(i=>i.id===x.id))s+=catButton_('seed','นำเข้าข้อมูลเริ่มต้น ('+x.name+')','data-cat-seed="'+x.id+'"');else if(catState.edit)s+=catButton_('reseed','อัปเดต'+x.name+'จากข้อมูลเริ่มต้น','data-cat-seed="'+x.id+'"');});if(catState.edit)s+='<form id="catNewForm" class="cat-new"><h2>+ สินค้าใหม่</h2><label class="cat-field">รหัสสินค้า (a-z, 0-9, ขีด)<input name="catId" required pattern="[a-z0-9-]{2,40}" maxlength="40"></label><label class="cat-field">ชื่อสินค้า<input name="catName" required maxlength="120"></label><button class="cat-btn cat-pri" type="submit">สร้างร่าง</button></form>';}
  document.getElementById('catMain').innerHTML=s+'</div>';
}
function catItemTools_(path){return catState.edit?catButton_('remove','ลบรายการ','data-cat-path="'+path+'"'):'';}
function catAdd_(path,kind,label){return catState.edit?catButton_('add',label||'+ เพิ่มรายการ','data-cat-path="'+path+'" data-cat-kind="'+kind+'"'):'';}
function catSection_(s,i){
  if(s.hidden&&!catState.edit)return '';const p='sections.'+i;let body='';
  if(s.type==='text')body=catText_(p+'.body',s.body,'div','cat-note');
  if(s.type==='videos'){
    const items=s.items||[],idx=Math.min(catState.video[i]||0,Math.max(0,items.length-1)),x=items[idx];
    if(x){const yt=catUrl_(x.youtube),src=catUrl_(x.src),poster=catUrl_(x.poster);body='<div class="cat-screen">'+(yt?'<a href="'+catEsc_(yt)+'" target="_blank" rel="noopener">'+(poster?'<img src="'+catEsc_(poster)+'" alt="'+catEsc_(x.name)+'" referrerpolicy="no-referrer">':'')+'<span>▶ เปิด YouTube</span></a>':src?'<video controls playsinline preload="metadata" src="'+catEsc_(src)+'" poster="'+catEsc_(poster)+'"></video>':'<div class="cat-wait">ยังไม่มีวิดีโอ</div>')+'</div>';}
    body+='<div class="cat-seg">'+items.map((x,j)=>'<button type="button" data-cat-op="video" data-cat-section="'+i+'" data-cat-index="'+j+'" aria-pressed="'+(j===idx)+'">'+catEsc_(x.name)+'<small>'+catEsc_(x.sub)+'</small></button>').join('')+'</div>';
    if(catState.edit)body+=items.map((x,j)=>{const q=p+'.items.'+j;return '<div class="cat-note">'+catText_(q+'.name',x.name,'h3')+catText_(q+'.sub',x.sub,'p')+catImage_(q+'.poster',x.poster,x.name)+'<label class="cat-field">ลิงก์ YouTube<input data-cat-url="'+q+'.youtube" value="'+catEsc_(x.youtube)+'" type="url" placeholder="https://www.youtube.com/watch?v=…"></label><label class="cat-field">ไฟล์วิดีโอ / URL<input data-cat-url="'+q+'.src" value="'+catEsc_(x.src)+'" placeholder="catalog-media/video.mp4"></label>'+catItemTools_(q)+'</div>';}).join('');
    body+=catAdd_(p+'.items','video');
  }
  if(s.type==='specs')body='<div class="cat-specs">'+(s.cards||[]).map((c,j)=>{const q=p+'.cards.'+j;return '<div class="cat-spec">'+catText_(q+'.title',c.title,'h3')+'<dl>'+(c.rows||[]).map((r,k)=>'<div>'+catText_(q+'.rows.'+k+'.0',r[0],'dt')+catText_(q+'.rows.'+k+'.1',r[1],'dd')+catItemTools_(q+'.rows.'+k)+'</div>').join('')+'</dl>'+catAdd_(q+'.rows','row','+ เพิ่มแถว')+catItemTools_(q)+'</div>';}).join('')+'</div>'+catAdd_(p+'.cards','card','+ เพิ่มการ์ดวัสดุ');
  if(s.type==='swatches')body=(s.groups||[]).map((g,j)=>{const q=p+'.groups.'+j;return '<div>'+catText_(q+'.name',g.name,'h3')+'<div class="cat-swatches">'+(g.items||[]).map((x,k)=>'<figure>'+catImage_(q+'.items.'+k+'.img',x.img,x.name)+catText_(q+'.items.'+k+'.name',x.name,'figcaption')+catItemTools_(q+'.items.'+k)+'</figure>').join('')+'</div>'+catAdd_(q+'.items','swatch')+catItemTools_(q)+'</div>';}).join('')+catAdd_(p+'.groups','group','+ เพิ่มกลุ่มสี');
  if(s.type==='gallery')body='<div class="cat-gallery'+((s.items||[]).length<=2?' cat-gallery-wide':'')+'">'+(s.items||[]).map((x,j)=>{const q=p+'.items.'+j,imgs=x.imgs||[],idx=Math.min(catState.gallery[i+':'+j]||0,Math.max(0,imgs.length-1));return '<figure>'+catImage_(q+'.imgs.'+idx,imgs[idx],x.name)+'<div class="cat-dots">'+imgs.map((v,k)=>'<button type="button" aria-label="รูปที่ '+(k+1)+'" aria-pressed="'+(k===idx)+'" data-cat-op="gallery" data-cat-section="'+i+'" data-cat-item="'+j+'" data-cat-index="'+k+'"></button>').join('')+'</div><figcaption>'+catText_(q+'.name',x.name,'h3')+catText_(q+'.note',x.note,'small')+catAdd_(q+'.imgs','image','+ เพิ่มรูป')+catItemTools_(q)+'</figcaption></figure>';}).join('')+'</div>'+catAdd_(p+'.items','gallery');
  let tools='';if(catState.edit)tools='<div class="cat-tools">'+catButton_('move','↑','data-cat-index="'+i+'" data-cat-delta="-1"')+catButton_('move','↓','data-cat-index="'+i+'" data-cat-delta="1"')+catButton_('hide',s.hidden?'แสดงหัวข้อ':'ซ่อนหัวข้อ','data-cat-index="'+i+'"')+catItemTools_(p)+'</div>';
  return '<section id="catSection'+i+'" class="cat-sec'+(s.hidden?' cat-hidden':'')+'">'+tools+'<div class="cat-sec-h">'+catText_(p+'.title',s.title,'h2')+catText_(p+'.en',s.en,'span','cat-en')+'</div>'+((s.lead||catState.edit)?catText_(p+'.lead',s.lead,'p','cat-lead'):'')+body+'</section>';
}
function catProduct_(){
  const x=catState.current,p=x.data;let s='<div class="cat-wrap cat-hero">'+catText_('en',p.en,'p','cat-eyebrow')+catText_('name',p.name,'h1')+(x.status==='draft'?'<span class="cat-draft">ร่าง · ผู้จัดการเท่านั้น</span>':'')+catText_('summary',p.summary,'p','cat-lead')+'<div class="cat-facts">'+(p.facts||[]).map((f,i)=>'<div class="cat-fact">'+catText_('facts.'+i+'.label',f.label,'small')+catText_('facts.'+i+'.value',f.value,'b')+catItemTools_('facts.'+i)+'</div>').join('')+'</div>'+catAdd_('facts','fact','+ เพิ่มข้อมูลสรุป');
  if(catState.edit)s+=catImage_('cover',p.cover,p.name);
  s+='<div class="cat-row">'+catButton_('contact','ส่งรูปช่องให้ประเมินราคา')+'</div></div><nav class="cat-toc" aria-label="หัวข้อ"><div class="cat-wrap">'+(p.sections||[]).map((v,i)=>!v.hidden||catState.edit?'<button type="button" data-cat-op="scroll" data-cat-index="'+i+'">'+catEsc_(v.title)+'</button>':'').join('')+'</div></nav><div class="cat-wrap">'+(p.sections||[]).map(catSection_).join('');
  if(catState.edit)s+='<div class="cat-tools">'+catAdd_('sections','text','+ หัวข้อข้อความ')+catAdd_('sections','gallery-section','+ หัวข้อรูป')+catAdd_('sections','videos-section','+ หัวข้อวิดีโอ')+catAdd_('sections','specs-section','+ หัวข้อวัสดุ')+catAdd_('sections','swatches-section','+ หัวข้อสี')+'</div>';
  document.getElementById('catMain').innerHTML=s+'</div>';
  if(catState.observer)catState.observer.disconnect();
  if(typeof IntersectionObserver!=='undefined'){catState.observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('[data-cat-op="scroll"]').forEach(a=>a.setAttribute('aria-current','catSection'+a.dataset.catIndex===e.target.id?'true':'false'));}),{rootMargin:'-110px 0px -55% 0px'});document.querySelectorAll('.cat-sec').forEach(el=>catState.observer.observe(el));}
}
function catRender_(){document.body.classList.toggle('cat-editing',catState.edit);catToolbar_();if(catState.current)catProduct_();else catHome_();catMeasure_();}
async function catRoute_(catLoading){
  const next=/^#p-[a-z0-9-]{2,40}$/.test(location.hash)?location.hash:'#home';if(next===catState.route&&catState.current)return;
  if(!catLoading&&(catState.busy||catState.dirty&&!await catAsk_('มีร่างที่ยังไม่บันทึก ต้องการออกจากหน้านี้หรือไม่? ร่างยังอยู่ในเครื่อง'))){history.replaceState(null,'',catState.route);return;}
  catState.route=next;catState.dirty=false;catState.current=null;catState.video={};catState.gallery={};
  if(next.startsWith('#p-')){const x=catState.items.find(x=>x.id===next.slice(3));if(x)catState.current=catCopy_(x);else catStatus_('ไม่พบสินค้านี้ หรือยังไม่ได้เผยแพร่');}
  catRender_();window.scrollTo(0,0);
}
async function catLoad_(){const d=await catFast_();catState.items=d.items.filter(x=>x.data&&x.id&&(x.status==='published'||catState.manager||x.status===undefined)).map(x=>({...x,status:x.status||'published'}));catState.current=null;catState.route='';await catRoute_(true);}
async function catSave_(){
  const x=catState.current;if(!x)return;const r=await catCall_('pk_catSave',{product:x.data,rev:x.rev,status:x.status,order:x.order});
  x.rev=r.rev;x.name=x.data.name;x.updatedAt=r.updatedAt;const i=catState.items.findIndex(v=>v.id===x.id);if(i<0)catState.items.push(catCopy_(x));else catState.items[i]=catCopy_(x);
  catState.dirty=false;try{localStorage.removeItem(catDraftKey_());}catch(e){}catStatus_('บันทึกแล้ว');catRender_();
}
async function catCancel_(){if(catState.dirty&&!await catAsk_('ยกเลิกการแก้ไขและลบร่างในเครื่องของสินค้านี้?'))return;const key=catState.current&&catDraftKey_();if(key)try{localStorage.removeItem(key);}catch(e){}catState.dirty=false;const x=catState.current&&catState.items.find(v=>v.id===catState.current.id);catState.current=x?catCopy_(x):null;catState.edit=false;catStatus_('ยกเลิกการแก้ไขแล้ว');if(!x){history.replaceState(null,'','#home');catState.route='#home';}catRender_();}
async function catShare_(native){const url=PK_CAT_URL+(catState.current?'#p-'+catState.current.id:'#home');if(native&&navigator.share){try{await navigator.share({title:catState.current?catState.current.name:'แคตตาล็อก PK',url});return;}catch(e){if(e.name==='AbortError')return;}}try{await navigator.clipboard.writeText(url);catStatus_('คัดลอกลิงก์แล้ว');}catch(e){catStatus_('คัดลอกลิงก์นี้: '+url);}}
function catTemplate_(kind){const common={title:'หัวข้อใหม่',en:'',lead:'',hidden:false};const map={fact:{label:'หัวข้อ',value:'ข้อมูล'},row:['หัวข้อ','ข้อมูล'],card:{title:'วัสดุ',rows:[]},group:{name:'กลุ่มสี',items:[]},swatch:{name:'ชื่อสี',img:''},video:{name:'รูปแบบ',sub:'',src:'',poster:'',youtube:''},gallery:{name:'ชื่อรูป',note:'',imgs:[]},image:'',text:{...common,type:'text',body:'พิมพ์ข้อความที่นี่'},'gallery-section':{...common,type:'gallery',items:[]},'videos-section':{...common,type:'videos',items:[]},'specs-section':{...common,type:'specs',cards:[]},'swatches-section':{...common,type:'swatches',groups:[]}};return catCopy_(map[kind]);}
async function catUpload_(file,path){
  if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('รับเฉพาะรูป JPEG, PNG หรือ WebP');
  const url=URL.createObjectURL(file);let img;try{img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('อ่านรูปไม่ได้'));im.src=url;});}finally{URL.revokeObjectURL(url);}
  const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const data=canvas.toDataURL('image/jpeg',0.85).split(',')[1];if(data.length*3/4>4*1024*1024)throw new Error('รูปหลังย่อยังเกิน 4 MB');
  const r=await catCall_('pk_catUploadImage',{name:file.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',data});catSet_(path,r.url);catRender_();
}
document.addEventListener('input',e=>{if(!catState.edit||!catState.current||catState.busy)return;const el=e.target.closest('[data-path]');if(el)catSet_(el.dataset.path,el.innerText.replace(/\r\n/g,'\n'));if(e.target.id==='catStatusSelect'){catState.current.status=e.target.value;catDirty_();}if(e.target.dataset.catUrl!==undefined){catSet_(e.target.dataset.catUrl,e.target.value);e.target.setCustomValidity(!e.target.value||catUrl_(e.target.value)?'':'ใช้ได้เฉพาะ URL ที่อนุญาต');}});
document.addEventListener('paste',e=>{if(catState.edit&&e.target.closest('[data-path]')){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));}});
document.addEventListener('submit',e=>{if(e.target.id!=='catNewForm')return;e.preventDefault();if(!catState.manager||!catState.edit||catState.busy)return;const form=new FormData(e.target),id=String(form.get('catId')).trim(),name=String(form.get('catName')).trim();if(!/^[a-z0-9-]{2,40}$/.test(id)||!name){catStatus_('กรุณาตรวจรหัสและชื่อสินค้า');return;}if(catState.items.some(x=>x.id===id)){catStatus_('รหัสสินค้านี้มีอยู่แล้ว');return;}catState.current={id,name,status:'draft',order:Math.max(0,...catState.items.map(x=>x.order))+1,rev:0,data:{id,name,en:'',summary:'',cover:'',facts:[],sections:[]}};catState.route='#p-'+id;history.replaceState(null,'',catState.route);catDirty_();catRender_();});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cat-op]'),im=e.target.closest('[data-cat-image]');if(!b&&!im)return;e.preventDefault();if(catState.busy)return;
  if(!b&&im&&catState.edit){document.getElementById('catPicker').dataset.catPath=im.dataset.catImage;document.getElementById('catPicker').click();return;}
  if(!b)return;const op=b.dataset.catOp;
  if(op==='home'){location.hash='#home';return;}if(op==='contact'){document.getElementById('catContact').scrollIntoView({behavior:'smooth'});return;}
  if(op==='scroll'){document.getElementById('catSection'+b.dataset.catIndex).scrollIntoView({behavior:'smooth'});return;}
  if(op==='copy'||op==='share'){catRun_(()=>catShare_(op==='share'));return;}
  if(op==='video'){catState.video[b.dataset.catSection]=+b.dataset.catIndex;catProduct_();return;}
  if(op==='gallery'){catState.gallery[b.dataset.catSection+':'+b.dataset.catItem]=+b.dataset.catIndex;catProduct_();return;}
  catRun_(async()=>{
    if(op==='reload'){if(catState.dirty&&!await catAsk_('โหลดข้อมูลล่าสุด? ร่างที่ยังไม่บันทึกยังเก็บอยู่ในเครื่อง'))return;catState.dirty=false;await catLoad_();return;}
    if(!catState.manager)return;
    if(op==='edit'){if(catState.edit&&catState.dirty){await catCancel_();return;}catState.edit=!catState.edit;catRender_();return;}
    if(op==='cancel'){await catCancel_();return;}if(op==='save'){await catSave_();return;}
    if(op==='recover'){const draft=catStored_();if(draft&&await catAsk_('กู้ร่างในเครื่อง? หากมีคนบันทึกก่อน ระบบจะให้โหลดใหม่ก่อนบันทึกทับ')){catState.current=catCopy_(draft);catState.edit=true;catDirty_();catRender_();}return;}
    if(op==='seed'){const x=CAT_SEEDS.find(v=>v.id===b.dataset.catSeed);if(!x||catState.items.some(i=>i.id===x.id))return;const r=await fetch('catalog-media/seed-'+x.id+'.json');if(!r.ok)throw new Error('โหลดข้อมูลเริ่มต้นไม่ได้');const product=await r.json();const order=catState.items.reduce((m,i)=>Math.max(m,i.order+1),0);await catCall_('pk_catSave',{product,rev:0,status:'draft',order});await catLoad_();catStatus_('นำเข้า'+x.name+'เป็นร่างแล้ว');return;}
    if(op==='reseed'){const x=CAT_SEEDS.find(v=>v.id===b.dataset.catSeed),cur=x&&catState.items.find(i=>i.id===x.id);if(!cur||!catState.edit)return;if(!await catAsk_('แทนที่ข้อมูล “'+x.name+'” ด้วยข้อมูลเริ่มต้นล่าสุด? สิ่งที่แก้ไขเองในสินค้านี้จะถูกแทนที่ (สถานะและลำดับคงเดิม)'))return;const r=await fetch('catalog-media/seed-'+x.id+'.json',{cache:'no-store'});if(!r.ok)throw new Error('โหลดข้อมูลเริ่มต้นไม่ได้');const product=await r.json();await catCall_('pk_catSave',{product,rev:cur.rev});await catLoad_();catStatus_('อัปเดต'+x.name+'แล้ว');return;}
    if(!catState.edit)return;
    if(op==='delete'){const id=b.dataset.catId,r=await catCall_('pk_catDelete',{id,dryRun:true});if(await catAsk_('ลบสินค้า “'+r.name+'” ออกจากแคตตาล็อก? ข้อมูลยังเก็บไว้กู้คืนได้')){await catCall_('pk_catDelete',{id,rev:r.rev,dryRun:false});await catLoad_();}return;}
    if(op==='order'){const items=catState.items.slice().sort((a,b)=>a.order-b.order||a.id.localeCompare(b.id)),i=items.findIndex(x=>x.id===b.dataset.catId),j=i+Number(b.dataset.catDelta);if(j<0||j>=items.length)return;const x=items[i],other=items[j],edge=items[j+Number(b.dataset.catDelta)];const order=edge?(other.order+edge.order)/2:other.order+Number(b.dataset.catDelta);if(order===other.order){catStatus_('ลำดับซ้ำ กรุณาโหลดใหม่หรือจัดลำดับจากรายการถัดไป');return;}await catCall_('pk_catSave',{product:x.data,rev:x.rev,order});await catLoad_();return;}
    if(!catState.current)return;
    if(op==='move'){const i=+b.dataset.catIndex,j=i+Number(b.dataset.catDelta),a=catState.current.data.sections;if(j>=0&&j<a.length)[a[i],a[j]]=[a[j],a[i]];catState.video={};catState.gallery={};}
    if(op==='hide'){const s=catState.current.data.sections[+b.dataset.catIndex];s.hidden=!s.hidden;}
    if(op==='remove'){if(!await catAsk_('ลบรายการนี้จากร่าง? จะมีผลต่อแคตตาล็อกเมื่อกดบันทึก'))return;const a=b.dataset.catPath.split('.'),idx=+a.pop();catGet_(a.join('.')).splice(idx,1);catState.video={};catState.gallery={};}
    if(op==='clear-image'){const path=b.dataset.catPath;if(/\.imgs\.\d+$/.test(path)){const a=path.split('.'),idx=+a.pop();catGet_(a.join('.')).splice(idx,1);}else catSet_(path,'');}
    if(op==='add'){const a=catGet_(b.dataset.catPath),cap=b.dataset.catPath==='sections'?30:b.dataset.catPath==='facts'?20:b.dataset.catPath.endsWith('.imgs')?8:60;if(a.length>=cap)throw new Error('เพิ่มได้สูงสุด '+cap+' รายการ');a.push(catTemplate_(b.dataset.catKind));}
    catDirty_();catRender_();
  });
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-cat-image]')){e.preventDefault();e.target.click();}});
document.getElementById('catPicker').addEventListener('change',e=>{const file=e.target.files[0],path=e.target.dataset.catPath;e.target.value='';if(file&&catState.edit&&catState.manager)catRun_(()=>catUpload_(file,path));});
window.addEventListener('beforeunload',e=>{if(catState.dirty||catState.busy){e.preventDefault();e.returnValue='';}});
window.addEventListener('hashchange',()=>catRoute_());window.addEventListener('resize',catMeasure_);
document.body.classList.toggle('cat-embed',new URLSearchParams(location.search).get('embed')==='1');
catState.user=catUser_();catState.manager=!!catState.user&&catState.user.role==='manager';catToolbar_();catRun_(()=>catLoad_());
</script></body></html>
